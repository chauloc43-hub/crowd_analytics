# FastTracker settings for the local YOLO11n webcam/API production profile.
# The association thresholds preserve FastTracker's low-score and occlusion
# handling behavior. Values are based on Ultralytics' shipped defaults.
tracker_type: fasttrack
track_high_thresh: 0.40
track_low_thresh: 0.10
new_track_thresh: 0.50
track_buffer: 45
match_thresh: 0.80
fuse_score: true

# FastTracker-specific occlusion controls.
reset_velocity_offset_occ: 5
reset_pos_offset_occ: 3
enlarge_bbox_occ: 1.10
dampen_motion_occ: 0.50
active_occ_to_lost_thresh: 10
occ_cover_thresh: 0.70
occ_reappear_window: 40
init_iou_suppress: 0.70
