# Fixed-webcam profile used by the interactive demo. Coordinates are reference-resolution based.
reference_resolution: [640, 480]

person_detector:
  # Selected detector for the production FastTracker webcam/API profile.
  # Keep the checkpoint in the shared artifact tree so Ultralytics receives
  # an existing local path and never treats this as a downloadable bare asset.
  model_path: artifacts/person_detector/yolo11n.pt
  # This is deliberately below FastTracker track_low_thresh (.10), allowing its
  # low-confidence recovery association to see the complete .10--.35 band.
  # It is not a UI/reporting precision threshold.
  tracker_input_confidence: 0.05
  # Preserve the complete low-score association band required by FastTracker.
  require_full_low_score_recovery: true
  evaluation_confidence: 0.20
  # Applies to the detector's conventional NMS path.
  iou_threshold: 0.60
  max_det: 300
  # Keep the normal live input compact; recovery can use a bounded 640px retry
  # after genuine raw-detector dropouts.
  imgsz: 512
  use_half: true
  recovery:
    enabled: true
    # Count raw detector candidates before FastTracker association. This avoids
    # treating a temporarily lost/unconfirmed local track as a detector miss.
    empty_frames_before_boost: 2
    boosted_imgsz: 640
    boost_frames: 3
    cooldown_frames: 45
    # Keep persistent small-object enhancement disabled for predictable latency.
    small_person_max_height_px: null
    small_person_frames_before_boost: 0
  # Detailed raw-detection telemetry copies result tensors to CPU. Keep it
  # disabled in normal live operation to protect latency.
  telemetry_enabled: false
  telemetry_sample_every_n_frames: 1

tracker:
  config_path: configs/fasttrack-live.yaml

# FastTracker owns short-term tracking. This stream-scoped layer gives the UI
# a stable person_id when a nearby, short-lived ID break can be recovered
# unambiguously. It is deliberately not biometric ReID and never survives a
# pipeline/session reset; uncertain or long *changed-ID* re-entries receive a
# new person_id. A retained FastTracker ID still has to pass the geometry gate.
person_identity:
  enabled: true
  max_inactive_frames: 90
  max_reassociation_gap_frames: 30
  base_match_distance_reference_px: 28
  max_match_distance_reference_px: 96
  max_prediction_speed_reference_px_per_frame: 10
  prediction_horizon_frames: 8
  max_continuity_distance_reference_px: 100
  max_area_ratio: 2.25
  max_aspect_ratio: 1.80
  match_score_threshold: 0.72
  ambiguity_margin: 0.12
  finalized_history_size: 1000

# Decide whether face evidence is worth spending YuNet compute on before calling
# either attribute model. Thresholds are camera seeds and must be revisited from
# router telemetry, not treated as universal distance measurements.
attribute_router:
  mode: adaptive  # face_first | adaptive | body_only
  minimum_track_age_frames: 3
  route_refresh_interval: 10
  route_stability_frames: 2
  estimated_face_ratio: 0.20
  minimum_estimated_face_size_px: 48
  # For a close seated subject, a box clipped only at the bottom can still
  # contain a clear face. Width >= 96 px permits one YuNet attempt.
  minimum_bottom_truncated_person_width_px: 96
  # People below this relative height remain unknown; larger crops may enter
  # the body model and must still pass its independent confidence threshold.
  minimum_relative_person_height: 0.12
  edge_margin_px: 3
  skip_severely_truncated: true
  face_failure_limit: 2
  face_cooldown_frames: 30

face_detector:
  model_path: artifacts/face_detector/face_detection_yunet_2023mar.onnx
  confidence_threshold: 0.80
  minimum_width: 48
  # Skip YuNet where a face cannot be useful and avoid the former second full-body pass.
  minimum_person_height: 100
  upper_person_ratio: 0.55
  full_person_fallback: false
  # Use the production eye-rotation crop policy.
  alignment:
    mode: eye_rotation
    padding_fraction: 0.30
    output_size: 224
  # Telemetry always measures blur/brightness/landmark validity, but these
  # gates intentionally stay off until labelled webcam calibration exists.
  quality:
    require_valid_landmarks: true

gender_classifier:
  model_path: artifacts/gender_classifier/best_model.pth
  input_size: 224
  confidence_threshold: 0.75
  minimum_observations: 3
  maximum_observations: 5
  stable_confidence: 0.90
  face_retry_interval: 5
  gender_success_interval: 8
  refresh_interval: 90
  max_face_tracks_per_frame: 4
  use_horizontal_tta: false

# This optional classifier is a calibrated fallback only after repeated YuNet misses.
# It never shares raw logits with the face classifier.
body_gender_classifier:
  enabled: true
  model_path: artifacts/body_gender_classifier/best_body_gender_model.pth
  confidence_threshold: 0.77
  minimum_person_width: 16
  minimum_person_height: 48
  max_body_tracks_per_frame: 4
  body_retry_interval: 4
  face_misses_before_body: 2
  # Face uncertainty is only meaningful after a complete temporal evidence
  # budget. This avoids sending a clear close-up to Body after its first three
  # otherwise consistent but low-confidence Face samples.
  face_unknown_predictions_before_body: 3
  face_fallback_min_observations: 5
  # Once body evidence is stable, only probe face this often for a higher-priority upgrade.
  # 24 processed frames keeps an upgrade path responsive without making YuNet
  # a per-frame cost for a remote/body-resolved track.
  face_upgrade_interval: 24
  minimum_observations: 2
  maximum_observations: 3
  stable_confidence: 0.90
  gender_success_interval: 4
  # Unknown evidence is retried after this many frames instead of being frozen
  # for the full resolved-label refresh window when people overlap.
  unknown_retry_interval: 20
  refresh_interval: 120

runtime:
  max_frame_width: 640
  use_mixed_precision: true
  # Pay model initialization before the first real webcam frame is analysed.
  warmup_models: true
  # Keep a first body fallback from stalling an otherwise live webcam session.
  warmup_body_classifier: true
  profiling_window: 120

analytics:
  stable_track_frames: 15
  trajectory_length: 60
  # Must exceed the live 45-frame tracker buffer so a recoverable ID retains its evidence.
  max_missing_frames: 60
  finalized_history_size: 1000
  # Camera-plane metrics only: they are not physical metres or people/m² until calibrated.
  trajectory:
    assumed_fps: 25.0
    history_length: 60
    velocity_window_frames: 8
    stationary_speed_threshold: 8.0
    stationary_duration_seconds: 2.0
  spatial:
    enabled: true
    zone_history_length: 300
    heatmap_grid_size: [16, 12]
    heatmap_decay: 0.995
    density_area_scale: 100000.0
  # Bounded session aggregates for the dashboard. Track IDs and crops are not
  # retained here; snapshots contain only counts and optional calibrated values.
  history:
    snapshot_interval_seconds: 5.0
    max_snapshots: 720
    flow_windows_seconds: [60.0, 300.0]
    max_flow_events: 2000
  # Define camera-specific polygons below before turning zone overlay on. Density and heatmap
  # remain useful with no zones because they use confirmed track foot points.
  enable_zones: true
  counting_line:
    p1: [50, 200]
    p2: [590, 200]
  zones: []


visualization:
  show_zones: true
  # Classroom seat/door overlays are opt-in because the dashboard carries the
  # same summaries and a permanent grid can obscure track boxes on webcam.
  show_classroom_regions: false
  show_seats: false
  show_seat_labels: false
  show_trajectories: false
  show_motion_labels: true
  show_heatmap: true
  heatmap_alpha: 0.25
  # The Gradio side panel already shows these metrics. Keep the video unobstructed for IDs/boxes.
  show_hud: false
