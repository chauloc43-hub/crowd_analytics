# Camera-specific classroom profile.  It deliberately starts without seat
# polygons: fill the reference-grid corners from a still frame before using
# its occupancy result in a demo.
extends: pipeline-live.yaml

# Clear inherited camera geometry so room/door setup is supplied only by this
# classroom profile.  Keep at most one legacy counting line until the generic
# crossing counter is upgraded to named door events.
analytics:
  zones: []
  counting_line: null

space:
  name: default_room
  # The demo room is calibrated as a 64 m² visible floor area.  This is kept
  # separate from the session's 32 default seats and from formal capacity.
  visible_floor_area_m2: 64.0
  # maximum_capacity: 50
  # After camera calibration, trace semantic zones as: Front = row 1,
  # Middle = rows 2-3, Back = row 4.  Leave polygons empty until their
  # reference-frame coordinates are measured from the actual camera view.
  zones: []
  counting_lines: []

classroom:
  enabled: true
  room_profile:
    name: default_room
    camera:
      reference_resolution: [640, 480]
    # Repeat measured values here only when also set in `space` above; the
    # runtime rejects conflicting physical calibration for one camera.
    visible_floor_area_m2: 64.0
    # maximum_capacity: 50
    layout_rules:
      minimum_row_gap_m: 0.70
      minimum_aisle_width_m: 0.60
      desk_height_m: 0.75
      chair_height_m: 0.45
    # Optional independent entrance region.  Do not put this ROI in
    # `space.zones`, because zones intentionally support inclusive overlap.
    # entrance:
    #   door_roi: [[540, 280], [640, 280], [640, 480], [540, 480]]
    #   counting_line: {p1: [540, 320], p2: [640, 320]}

  layout_templates:
    - name: lecture_2_4_2
      blocks: {left: 2, center: 4, right: 2}
      # Default demo layout: left 2, aisle, center 4, aisle, right 2.
      # Four rows below therefore produce 8 x 4 = 32 session seats.
      # Trace the visible seating plane in this camera's reference frame.
      # The point order is top-left, top-right, bottom-right, bottom-left.
      # reference_grid:
      #   region: [[80, 150], [560, 150], [640, 470], [0, 470]]
      #   block_gap_units: 0.50
      #   row_gap_units: 0.15
      #   seat_anchor_ratio: 0.65

  # This remains dynamic: change rows or disable individual seats per class
  # without reloading YOLO, FastTracker, or either attribute classifier.
  session_layout:
    room_profile: default_room
    template: lecture_2_4_2
    rows: 4
    disabled_seats: []

  seat_occupancy:
    occupancy_confirm_seconds: 1.5
    vacancy_grace_seconds: 2.0
    # A crop or a different webcam aspect ratio invalidates reference-seat
    # geometry instead of silently stretching it.
    aspect_ratio_tolerance: 0.02

visualization:
  # Keep both off while drawing calibration points.  Turn these on after the
  # reference grid is verified so the video remains readable.
  show_classroom_regions: false
  show_seats: false
  show_seat_labels: false
